name: Deploy Spex SIM

on:
  push:
    branches:
      - sim_v1

jobs:
  deploy:
    name: Pull Code, Build, Migrate, Restart
    runs-on: self-hosted

    steps:
      - name: Deploy on server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Deploying sim_v1 to /home/sim..."
          cd /home/sim

          git -c safe.directory=/home/sim remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/Spex-Labs-Co/workflow-builder.git
          git -c safe.directory=/home/sim fetch origin sim_v1
          git -c safe.directory=/home/sim reset --hard origin/sim_v1
          git -c safe.directory=/home/sim clean -fd

          if [ -f /home/sim/apps/sim/.env ]; then
            cp /home/sim/apps/sim/.env /home/sim/packages/db/.env
          fi

          echo "Installing dependencies..."
          bun install --frozen-lockfile

          echo "Running migrations..."
          cd /home/sim/packages/db
          bun run db:migrate

          echo "Building app..."
          cd /home/sim/apps/sim
          bun run build

          echo "Restarting services..."
          sudo systemctl daemon-reload
          sudo systemctl restart simstudio.service
          sudo systemctl restart sim-realtime.service

          if systemctl list-unit-files | grep -q '^sim-worker.service'; then
            sudo systemctl restart sim-worker.service
          fi

          echo "SIM deployment complete."
