name: CI

on:
  push:
    branches: [main, staging, dev, sim_v1]
  pull_request:
    branches: [main, staging, dev, sim_v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-build:
    name: Test and Build
    uses: ./.github/workflows/test-build.yml
    secrets: inherit

  detect-spex-changes:
    name: Detect Spex Deploy Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/sim_v1'
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.filter.outputs.build }}
      deploy_required: ${{ steps.set_flags.outputs.deploy_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build:
              - 'apps/**'
              - 'docker/**'
              - 'packages/**'
              - 'bun.lock'
              - 'package.json'
            deploy_only:
              - 'docker-compose.spex-prod.yml'

      - id: set_flags
        run: |
          if [ "${{ steps.filter.outputs.build }}" = "true" ] || [ "${{ steps.filter.outputs.deploy_only }}" = "true" ]; then
            echo "deploy_required=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_required=false" >> $GITHUB_OUTPUT
          fi

  build-spex-images:
    name: Build Spex Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/sim_v1' && needs.detect-spex-changes.outputs.build_required == 'true'
    needs: [test-build, detect-spex-changes]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit

  deploy-coolify:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/sim_v1' && always() && needs.detect-spex-changes.outputs.deploy_required == 'true' && needs.test-build.result == 'success' && (needs.build-spex-images.result == 'success' || needs.build-spex-images.result == 'skipped')
    needs: [test-build, detect-spex-changes, build-spex-images]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: >-
          curl --fail --show-error --request GET
          "${{ secrets.COOLIFY_SIM_DEPLOY_WEBHOOK }}"
          --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  # Detect if this is a version release commit (e.g., "v0.5.24: ...")
  detect-version:
    name: Detect Version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/dev')
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_release: ${{ steps.extract.outputs.is_release }}
    steps:
      - name: Extract version from commit message
        id: extract
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Only tag versions on main branch
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [[ "$COMMIT_MSG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+): ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "✅ Detected release commit: ${VERSION}"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not a release commit"
          fi

  # Build ARM64 images for GHCR (main branch only, runs in parallel)
  build-ghcr-arm64:
    name: Build ARM64 (GHCR Only)
    needs: [detect-version]
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./docker/app.Dockerfile
            image: ghcr.io/simstudioai/simstudio
          - dockerfile: ./docker/db.Dockerfile
            image: ghcr.io/simstudioai/migrations
          - dockerfile: ./docker/realtime.Dockerfile
            image: ghcr.io/simstudioai/realtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Generate ARM64 tags
        id: meta
        run: |
          IMAGE="${{ matrix.image }}"
          TAGS="${IMAGE}:latest-arm64,${IMAGE}:${{ github.sha }}-arm64"

          # Add version tag if this is a release commit
          if [ "${{ needs.detect-version.outputs.is_release }}" = "true" ]; then
            VERSION="${{ needs.detect-version.outputs.version }}"
            TAGS="${TAGS},${IMAGE}:${VERSION}-arm64"
            echo "📦 Adding version tag: ${VERSION}-arm64"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push ARM64 to GHCR
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

  # Create GHCR multi-arch manifests (only for main, after both builds)
  create-ghcr-manifests:
    name: Create GHCR Manifests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-ghcr-arm64, detect-version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/simstudioai/simstudio
          - image: ghcr.io/simstudioai/migrations
          - image: ghcr.io/simstudioai/realtime

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE_BASE="${{ matrix.image }}"

          docker buildx imagetools create \
            -t "${IMAGE_BASE}:latest" \
            "${IMAGE_BASE}:latest-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_BASE}:${{ github.sha }}" \
            "${IMAGE_BASE}:${{ github.sha }}-arm64"

          # Create version manifest if this is a release commit
          if [ "${{ needs.detect-version.outputs.is_release }}" = "true" ]; then
            VERSION="${{ needs.detect-version.outputs.version }}"
            echo "📦 Creating version manifest: ${VERSION}"
            docker buildx imagetools create \
              -t "${IMAGE_BASE}:${VERSION}" \
              "${IMAGE_BASE}:${VERSION}-arm64"
          fi

  # Check if docs changed
  check-docs-changes:
    name: Check Docs Changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2  # Need at least 2 commits to detect changes
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'apps/docs/content/docs/en/**'
              - 'apps/sim/scripts/process-docs.ts'
              - 'apps/sim/lib/chunkers/**'

  # Process docs embeddings (only when docs change, after ECR images are pushed)
  process-docs:
    name: Process Docs
    needs: [build-ghcr-arm64, check-docs-changes]
    if: needs.check-docs-changes.outputs.docs_changed == 'true'
    uses: ./.github/workflows/docs-embeddings.yml
    secrets: inherit

  # Create GitHub Release (only for version commits on main, after all builds complete)
  create-release:
    name: Create GitHub Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [create-ghcr-manifests, detect-version]
    if: needs.detect-version.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/create-single-release.ts ${{ needs.detect-version.outputs.version }}
