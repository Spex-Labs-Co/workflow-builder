name: Build and Push Spex Images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    name: Build ARM64
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./docker/app.Dockerfile
            image: ghcr.io/spex-labs-co/workflow-builder-simstudio
          - dockerfile: ./docker/app.Dockerfile
            image: ghcr.io/spex-labs-co/workflow-builder-sim-worker
          - dockerfile: ./docker/db.Dockerfile
            image: ghcr.io/spex-labs-co/workflow-builder-migrations
          - dockerfile: ./docker/realtime.Dockerfile
            image: ghcr.io/spex-labs-co/workflow-builder-realtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Generate ARM64 tags
        id: meta
        run: |
          IMAGE="${{ matrix.image }}"
          echo "tags=${IMAGE}:latest-arm64,${IMAGE}:${{ github.sha }}-arm64" >> $GITHUB_OUTPUT

      - name: Build and push ARM64 image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

  create-manifests:
    name: Create Multi-Arch Manifests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/spex-labs-co/workflow-builder-simstudio
          - image: ghcr.io/spex-labs-co/workflow-builder-sim-worker
          - image: ghcr.io/spex-labs-co/workflow-builder-migrations
          - image: ghcr.io/spex-labs-co/workflow-builder-realtime

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE_BASE="${{ matrix.image }}"

          docker buildx imagetools create \
            -t "${IMAGE_BASE}:latest" \
            "${IMAGE_BASE}:latest-arm64"

          docker buildx imagetools create \
            -t "${IMAGE_BASE}:${{ github.sha }}" \
            "${IMAGE_BASE}:${{ github.sha }}-arm64"
